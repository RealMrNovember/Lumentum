# aaPanel extension — YALNIZCA lumentum.cicibyte.com
# Hedef: /www/server/panel/vhost/nginx/extension/lumentum.cicibyte.com/api.conf
# aaPanel → Site → lumentum.cicibyte.com → Config → extension dizinine kopyala

# Gizli dizinler
location ^~ /data/ { return 404; }
location ^~ /scripts/ { return 404; }
location ^~ /api/.env { return 404; }

# FastAPI upstream (lumentum-api.service)
location /api/ {
    proxy_pass http://127.0.0.1:18765/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

# Flutter web SPA — build root'a deploy edildiğinde
location / {
    try_files $uri $uri/ /index.html;
}
